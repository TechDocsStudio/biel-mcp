[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "biel-mcp"
version = "2.1.1"
description = "Connect MCP clients to documentation indexed by Biel.ai"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp>=2.3,<2.4",
    "httpx>=0.26.0",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
test = ["asgi-lifespan>=2.1,<3"]

[project.urls]
Homepage = "https://biel.ai"
Repository = "https://github.com/TechDocsStudio/biel-mcp"
Documentation = "https://docs.biel.ai/integrations/mcp-server"

[project.scripts]
biel-mcp = "biel_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
