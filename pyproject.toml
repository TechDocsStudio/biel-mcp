[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "biel-mcp"
version = "2.0.0"
description = "Connect MCP clients to documentation indexed by Biel.ai"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.26.0",
    "sse-starlette>=2.1.3",
    "uvicorn>=0.32.0",
]

[project.urls]
Homepage = "https://biel.ai"
Repository = "https://github.com/TechDocsStudio/biel-mcp"
Documentation = "https://docs.biel.ai/integrations/mcp-server"

[project.scripts]
biel-mcp = "biel_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
